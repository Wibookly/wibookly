    <!-- Apply persisted palette + light/dark BEFORE first paint to prevent FOUC -->
    <script>
      (function(){
        try{
          var p = localStorage.getItem('inboxiq-palette') || 'aurora';
          var m = localStorage.getItem('inboxiq-mode');
          document.documentElement.setAttribute('data-palette', p);
          document.documentElement.setAttribute('data-theme', p);
          if (m === 'dark' || (!m && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
